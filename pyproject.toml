[project]
name = "python-essentials-for-rag"
version = "0.1.0"
description = "The Python a JavaScript or TypeScript developer needs to build a RAG pipeline, one chapter at a time."
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "numpy",
    "pydantic",
    "pypdf",
    "sentence-transformers",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "evals"]
