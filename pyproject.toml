[project]
name = "python-essentials-for-rag"
version = "0.1.0"
description = "The Python you need to build a RAG pipeline and an eval harness, one chapter at a time."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi[standard]>=0.165.0",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
tools = [
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "evals", "app"]
